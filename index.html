<script>
// ══════════════════════════════════════════════════════════════════
// CONFIGURATION
// ══════════════════════════════════════════════════════════════════
const API_BASE = 'https://apihub.agnes-ai.com/v1';
const POLL_BASE = 'https://apihub.agnes-ai.com/agnesapi';
const MODEL_TEXT = 'agnes-2.5-flash';
const MODEL_IMAGE = 'agnes-image-2.1-flash';
const MODEL_VIDEO = 'agnes-video-v2.0';
const FRAME_RATE = 24;

const IMAGE_PARALLEL = 3;
const IMAGE_INTERVAL_MS = 3400;
const VIDEO_FIRST_POLL_DELAY_SEC = 60;
const VIDEO_POLL_INTERVALS = [8,8,12,12,20,20,25];
const VIDEO_MAX_POLL_ATTEMPTS = 100;

const API_KEY_STORAGE = 'bd_animee_pro_api_key';
const DEBUG_MAX = 500;

// ══════════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════════
const state = {
  plancheBase64: null,
  visageBase64: null,
  selectedStyle: 'franco-belge',
  nbCases: 6,
  durVideo: 145,
  mode: 'full',
  parsedScript: [],
  cases: [],
  isRunning: false,
  stopRequested: false,
  isPlayingFilm: false,
  playRAF: null,
  startTime: 0
};

// ══════════════════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════════════════
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function setStatus(t){const b=document.getElementById('status-bar');const x=document.getElementById('status-text');if(!b||!x)return;if(t){b.classList.add('visible');x.textContent=t}else b.classList.remove('visible')}
function nowTime(){return new Date().toLocaleTimeString('fr-FR',{hour12:false})}

let toastTimeout=null;
function showToast(msg,type='success',dur=2500){
  const t=document.getElementById('toast');const i=document.getElementById('toast-icon');const x=document.getElementById('toast-text');
  if(!t||!i||!x)return;
  t.classList.remove('visible','success','error','warn');void t.offsetWidth;
  const ic={success:'✓',error:'✕',warn:'⚠'};
  i.textContent=ic[type]||'✓';x.textContent=msg;
  t.classList.add(type);
  requestAnimationFrame(()=>t.classList.add('visible'));
  if(toastTimeout)clearTimeout(toastTimeout);
  toastTimeout=setTimeout(()=>t.classList.remove('visible'),dur);
}
</script>
<script>
// ══════════════════════════════════════════════════════════════════
// JOURNAL NARRATIF
// ══════════════════════════════════════════════════════════════════
function journalLog(msg,level){
  level = level || 'info';
  const body = document.getElementById('journal-body');
  if(!body) return;
  const icons = { info:'·', highlight:'▶', success:'✅', warn:'⚠️', error:'❌', image:'🖼️', video:'🎬', film:'🎞️', api:'📡' };
  const icon = icons[level] || '·';
  const entry = document.createElement('div');
  entry.className = 'j-entry ' + level;
  entry.innerHTML = '<span class="j-time">'+esc(nowTime())+'</span><span class="j-icon">'+icon+'</span><span class="j-msg">'+esc(msg)+'</span>';
  body.appendChild(entry);
  body.scrollTop = body.scrollHeight;
  while(body.children.length > DEBUG_MAX) body.removeChild(body.firstChild);
}

// ══════════════════════════════════════════════════════════════════
// DEBUG TECHNIQUE
// ══════════════════════════════════════════════════════════════════
let debugCount=0,debugEntries=[],debugCollapsed=false,currentTab='journal';
function debugLog(level,cat,msg,data){
  const body=document.getElementById('tech-body');if(!body)return;
  const time=nowTime();
  const entry=document.createElement('div');entry.className='debug-entry '+level;
  let html='<span class="debug-time">'+time+'</span><span class="debug-cat">['+esc(cat)+']</span><span class="debug-msg">'+esc(msg)+'</span>';
  if(data!==undefined&&data!==null){
    let ds;
    if(typeof data==='string')ds=data;
    else{try{ds=JSON.stringify(data,null,2)}catch(e){ds=String(data)}}
    if(ds.length>1500)ds=ds.slice(0,1500)+'\n…[tronqué]';
    html+='<pre style="margin-top:.3rem;padding:.4rem;background:#0a0a12;border:1px solid var(--border);border-radius:2px;font-size:.62rem;color:#a8d8b0;max-height:120px;overflow:auto;white-space:pre-wrap;word-break:break-all">'+esc(ds)+'</pre>';
  }
  entry.innerHTML=html;body.appendChild(entry);
  debugEntries.push({time,level,cat,msg});
  while(body.children.length>DEBUG_MAX)body.removeChild(body.firstChild);
  body.scrollTop=body.scrollHeight;
  debugCount++;
  const cnt=document.getElementById('debug-count');
  if(cnt)cnt.textContent=debugCount;
}
function clearDebug(){
  const b=document.getElementById('tech-body');const j=document.getElementById('journal-body');
  if(b)b.innerHTML='';if(j)j.innerHTML='';
  debugEntries=[];debugCount=0;
}
function copyDebug(){
  const lines=debugEntries.map(e=>e.time+' ['+e.cat+'] '+e.msg).join('\n');
  const finish=(ok)=>showToast(ok?'Console copiée':'Copie impossible',ok?'success':'error');
  try{
    if(navigator.clipboard&&window.isSecureContext){
      navigator.clipboard.writeText(lines).then(()=>finish(true)).catch(()=>legacyCopy(lines,finish));
      return;
    }
  }catch(e){}
  legacyCopy(lines,finish);
}
function legacyCopy(text,cb){
  const ta=document.createElement('textarea');ta.value=text;
  ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.focus();ta.select();
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  document.body.removeChild(ta);cb(ok);
}
function toggleDebug(){
  const p=document.getElementById('debug-panel');
  const b=document.getElementById('debug-collapse-btn');
  if(!p||!b)return;
  debugCollapsed=!debugCollapsed;
  p.classList.toggle('collapsed',debugCollapsed);
  b.textContent=debugCollapsed?'+':'−';
}
function switchTab(tab){
  currentTab=tab;
  const j=document.getElementById('journal-body');
  const t=document.getElementById('tech-body');
  const tj=document.getElementById('tab-journal');
  const tt=document.getElementById('tab-tech');
  if(!j||!t)return;
  if(tab==='journal'){j.classList.remove('hidden');t.classList.add('hidden');tj.classList.add('active');tt.classList.remove('active')}
  else{t.classList.remove('hidden');j.classList.add('hidden');tt.classList.add('active');tj.classList.remove('active');t.scrollTop=t.scrollHeight}
}
</script><script>
// ══════════════════════════════════════════════════════════════════
// CLÉ API
// ══════════════════════════════════════════════════════════════════
function getKey(){try{return(localStorage.getItem(API_KEY_STORAGE)||'').trim()}catch(e){return''}}
function saveKey(){
  const v=document.getElementById('api-key-input').value.trim();
  if(!v){localStorage.removeItem(API_KEY_STORAGE);updateApiPanel();showToast('Clé supprimée','warn');return}
  if(!v.startsWith('sk-')){if(!confirm('La clé ne commence pas par "sk-". Sauvegarder quand même ?'))return}
  try{localStorage.setItem(API_KEY_STORAGE,v)}catch(e){}
  updateApiPanel();showToast('Clé enregistrée ✓','success');
  debugLog('success','API','Clé : '+v.slice(0,8)+'…'+v.slice(-4));
  journalLog('Clé API enregistrée.','success');
}
function updateApiPanel(){
  const key=getKey();
  const panel=document.getElementById('api-panel');
  const line=document.getElementById('api-status-line');
  const text=document.getElementById('api-status-text');
  const input=document.getElementById('api-key-input');
  if(!panel||!line||!text||!input)return;
  if(key){
    panel.classList.add('ok');line.classList.add('ok');
    text.textContent='Clé active · '+key.slice(0,8)+'…'+key.slice(-4);
    input.value=key;
  } else {
    panel.classList.remove('ok');line.classList.remove('ok');
    text.textContent='Aucune clé API enregistrée';
    input.value='';
  }
  updateLaunchBtn();
}

// ══════════════════════════════════════════════════════════════════
// UPLOAD IMAGES
// ══════════════════════════════════════════════════════════════════
function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}
async function compressImage(b64,maxSide){
  maxSide = maxSide || 1400;
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      const scale=Math.min(1,maxSide/Math.max(w,h));
      w=Math.round(w*scale);h=Math.round(h*scale);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',0.88));
    };
    img.onerror=()=>resolve(b64);
    img.src=b64;
  });
}
async function handleFile(file,type){
  if(!file||!file.type.startsWith('image/')){showToast('Fichier non-image','error');return}
  const raw=await fileToBase64(file);
  const compressed=await compressImage(raw,type==='visage'?1000:1600);
  if(type==='planche')state.plancheBase64=compressed;
  else state.visageBase64=compressed;
  renderUpload(type,compressed);
  debugLog('success','UPLOAD',type+' chargé ('+Math.round(compressed.length/1024)+' Ko)');
  journalLog(type==='planche'?'Planche BD chargée.':'Visage chargé.','success');
  updateLaunchBtn();
}
function renderUpload(type,base64){
  const zone=document.getElementById('zone-'+type);
  if(!zone)return;
  zone.classList.add('has-image');
  zone.innerHTML='<img src="'+base64+'" alt="'+type+'"><button class="remove-btn" data-remove="'+type+'">✕</button>';
  zone.querySelector('[data-remove]').addEventListener('click',e=>{
    e.stopPropagation();
    if(type==='planche')state.plancheBase64=null;
    else state.visageBase64=null;
    resetUpload(type);
    updateLaunchBtn();
  });
}
function resetUpload(type){
  const zone=document.getElementById('zone-'+type);
  if(!zone)return;
  zone.classList.remove('has-image');
  const isPlanche=type==='planche';
  zone.innerHTML='<input type="file" accept="image/*" id="file-'+type+'">'+
    '<div class="up-icon">'+(isPlanche?'🖼️':'👤')+'</div>'+
    '<div class="up-text"><strong>'+(isPlanche?'PLANCHE BD ORIGINALE':'TON VISAGE')+'</strong>'+(isPlanche?'Ta planche de BD complète':'Portrait face caméra')+'</div>';
  bindUpload(type);
}
function bindUpload(type){
  const input=document.getElementById('file-'+type);
  if(!input)return;
  input.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)handleFile(f,type)});
}

// ══════════════════════════════════════════════════════════════════
// BOUTON LAUNCH
// ══════════════════════════════════════════════════════════════════
function updateLaunchBtn(){
  const btn=document.getElementById('launch-btn');
  if(!btn)return;
  const hasKey=!!getKey();
  const hasPlanche=!!state.plancheBase64;
  const hasVisage=!!state.visageBase64;
  btn.disabled=!hasKey||!hasPlanche||!hasVisage||state.isRunning;
  if(state.isRunning)btn.innerHTML='⏳ Génération en cours…';
  else if(!hasKey)btn.innerHTML='🔑 Ajoutez votre clé API';
  else if(!hasPlanche)btn.innerHTML='🖼️ Chargez la planche BD';
  else if(!hasVisage)btn.innerHTML='👤 Chargez votre visage';
  else btn.innerHTML='🎬 GÉNÉRER LA BD ANIMÉE<span style="display:block;font-size:.65rem;letter-spacing:.15em;color:var(--dim);margin-top:.4rem;font-weight:400;text-transform:none">'+state.nbCases+' cases · '+Math.round(state.durVideo/24)+'s par vidéo</span>';
}
</script><script>
// ══════════════════════════════════════════════════════════════════
// API FETCH
// ══════════════════════════════════════════════════════════════════
async function apiFetch(url,options,label,maxAttempts){
  options=options||{};
  label=label||'API';
  maxAttempts=maxAttempts||5;
  let lastErr=null;
  for(let attempt=0;attempt<maxAttempts;attempt++){
    if(state.stopRequested)throw new Error('Arrêt demandé');
    try{
      const headers=Object.assign({},options.headers||{},{'Authorization':'Bearer '+getKey()});
      debugLog('api','REQ '+label,(options.method||'GET')+' '+url.slice(0,80)+'… (essai '+(attempt+1)+')');
      const t0=Date.now();
      const res=await fetch(url,Object.assign({},options,{headers}));
      const dt=Date.now()-t0;
      debugLog('response','RÉP '+label,'HTTP '+res.status+' en '+dt+'ms');
      if(res.ok)return res;
      if([400,401,403,404].includes(res.status)){
        const err=await res.text().catch(()=>'');
        throw new Error('HTTP '+res.status+' — '+err.slice(0,200));
      }
      if(res.status===429){
        const wait=Math.min(120,20+attempt*20);
        debugLog('warn','RATELIMIT','429 → attente '+wait+'s');
        setStatus('Limite API — attente '+wait+'s');
        await sleep(wait*1000);continue;
      }
      if([500,502,503,504,520].includes(res.status)){
        const wait=Math.min(60,8+attempt*6);
        debugLog('warn','SERVICE','HTTP '+res.status+' → attente '+wait+'s');
        await sleep(wait*1000);continue;
      }
      const wait=Math.min(60,6+attempt*5);
      await sleep(wait*1000);
    }catch(e){
      if(e.message==='Arrêt demandé')throw e;
      if(/^HTTP (4\d\d)/.test(e.message))throw e;
      lastErr=e;
      const wait=Math.min(45,4+attempt*4);
      debugLog('warn','NETWORK',e.message+' → retry '+wait+'s');
      await sleep(wait*1000);
    }
  }
  throw lastErr||new Error('Échec '+label);
}

// ══════════════════════════════════════════════════════════════════
// PARSER SCRIPT
// ══════════════════════════════════════════════════════════════════
function parseScript(text){
  const cases=[];
  const lines=text.split('\n');
  let currentCase=null;
  let currentDialogue='';
  for(const line of lines){
    const trimmed=line.trim();
    if(!trimmed)continue;
    const caseMatch=trimmed.match(/^Case\s+(\d+)\s*[—\-–:]\s*(.+)$/i);
    if(caseMatch){
      if(currentCase){currentCase.dialogue=currentDialogue.trim();cases.push(currentCase)}
      currentCase={num:parseInt(caseMatch[1]),desc:caseMatch[2].trim(),dialogue:''};
      currentDialogue='';
      continue;
    }
    const dialogMatch=trimmed.match(/^Dialogue\s*:\s*(.+)$/i);
    if(dialogMatch){currentDialogue=dialogMatch[1].trim();continue}
    if(currentCase&&!currentDialogue){
      currentCase.desc+=' '+trimmed;
    } else if(currentCase){
      currentDialogue+=' '+trimmed;
    }
  }
  if(currentCase){currentCase.dialogue=currentDialogue.trim();cases.push(currentCase)}
  debugLog('info','SCRIPT',cases.length+' cases parsées');
  return cases;
}

// ══════════════════════════════════════════════════════════════════
// STYLE PROMPTS
// ══════════════════════════════════════════════════════════════════
function getStylePrompt(style){
  const styles={
    'franco-belge':'franco-belgian bande dessinée, ligne claire style, thick black outlines, flat saturated colors, clean Hergé/Uderzo inspired rendering, comic book panel with a thin black border',
    'realiste':'realistic comic book style, painterly rendering, dramatic lighting, rich colors, detailed shading, adult graphic novel aesthetic',
    'cartoon':'colorful cartoon style, bold thick outlines, simple shapes, vibrant flat colors, humorous exaggerated expressions, kids comic book',
    'manga':'black and white japanese manga style, screentones, dynamic ink lines, expressive eyes, dramatic angles, shonen aesthetic',
    'aquarelle':'soft watercolor illustration style, gentle bleeding edges, paper texture, pastel washes, delicate ink outlines, poetic children book illustration',
    'encre':'black ink illustration style, hand-drawn brushwork, high contrast, white paper background, minimalist, expressive, no color'
  };
  return styles[style]||styles['franco-belge'];
}
