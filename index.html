// ══════════════════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════════════════
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function setStatus(t){const b=document.getElementById('status-bar');const x=document.getElementById('status-text');if(!b||!x)return;if(t){b.classList.add('visible');x.textContent=t}else b.classList.remove('visible')}
function nowTime(){return new Date().toLocaleTimeString('fr-FR',{hour12:false})}

let toastTimeout=null;
function showToast(msg,type='success',dur=2500){
  const t=document.getElementById('toast');const i=document.getElementById('toast-icon');const x=document.getElementById('toast-text');
  if(!t||!i||!x)return;
  t.classList.remove('visible','success','error','warn');void t.offsetWidth;
  const ic={success:'✓',error:'✕',warn:'⚠'};
  i.textContent=ic[type]||'✓';x.textContent=msg;
  t.classList.add(type);
  requestAnimationFrame(()=>t.classList.add('visible'));
  if(toastTimeout)clearTimeout(toastTimeout);
  toastTimeout=setTimeout(()=>t.classList.remove('visible'),dur);
}
